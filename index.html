<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q3 - Student Table with Edit/Delete</title>
</head>
<body>

<h2>Add Student</h2>

<form id="studentForm">
  <label>Name: <input type="text" id="studentName" required></label><br><br>
  <label>Roll No: <input type="text" id="rollNo" required></label><br><br>
  <label>Class: <input type="text" id="className" required></label><br><br>
  <button type="submit">Add Student</button>
</form>

<hr>

<h2 id="editFormTitle" style="display:none;">Edit Student</h2>

<form id="editForm" style="display:none;">
  <label>Name: <input type="text" id="editName" required></label><br><br>
  <label>Roll No: <input type="text" id="editRollNo" required></label><br><br>
  <label>Class: <input type="text" id="editClassName" required></label><br><br>
  <button type="submit">Update Student</button>
  <button type="button" id="cancelEditBtn">Cancel</button>
</form>

<hr>

<h2>Student List</h2>

<table id="studentTable" border="1" cellpadding="8">
  <thead>
    <tr>
      <th>#</th>
      <th>Name</th>
      <th>Roll No</th>
      <th>Class</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="studentTableBody"></tbody>
</table>

<script src="script.js"></script>
</body>
</html>
